name: Publish Linux release from successful build

on:
  # Validate the workflow on the feature branch without publishing anything.
  push:
    branches: ["feature/native-linux"]
    paths:
      - ".github/workflows/publish-linux.yml"
  pull_request:
    paths:
      - ".github/workflows/publish-linux.yml"
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux build workflow run ID (shown in its summary)
        required: true
        type: string
      tag:
        description: New release tag, for example v0.6.1-linux. Must not already exist.
        required: true
        type: string
      release_name:
        description: Release title
        required: true
        default: "Let's Go Recomp for Linux"
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  # Push and PR runs prove GitHub can load this workflow; they never publish a release.
  validate-workflow:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm publish workflow is loadable
        run: echo "Publish workflow syntax loaded. Release publishing is disabled for push and pull_request events."

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be numeric" >&2; exit 1; }
          gh run view "$RUN_ID" --repo "$REPOSITORY" --json status,conclusion,workflowName,event
          status="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json status --jq .status)"
          conclusion="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json conclusion --jq .conclusion)"
          workflow="$(gh run view "$RUN_ID" --repo "$REPOSITORY" --json workflowName --jq .workflowName)"
          [[ "$status" == completed && "$conclusion" == success && "$workflow" == "Linux native build" ]] || {
            echo "Refusing to publish: the run must be a successful Linux native build." >&2; exit 1;
          }
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name letsgo-recomp-linux-x86_64 --dir artifact

      - name: Validate bundles, checksums and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag name" >&2; exit 1; }

          bundles=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz)
          bundle_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz.sha256)
          appimages=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage)
          appimage_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage.sha256)

          [[ "${#bundles[@]}" -eq 1 && -f "${bundles[0]}" ]] || {
            echo "Expected exactly one self-contained Linux directory archive." >&2; exit 1;
          }
          [[ "${#bundle_checksums[@]}" -eq 1 && -f "${bundle_checksums[0]}" ]] || {
            echo "Expected exactly one archive SHA-256 checksum." >&2; exit 1;
          }
          [[ "${#appimages[@]}" -eq 1 && -f "${appimages[0]}" ]] || {
            echo "Expected exactly one Linux x86_64 AppImage." >&2; exit 1;
          }
          [[ "${#appimage_checksums[@]}" -eq 1 && -f "${appimage_checksums[0]}" ]] || {
            echo "Expected exactly one AppImage SHA-256 checksum." >&2; exit 1;
          }

          verify_sha256() {
            local file="$1" checksum_file="$2" expected actual
            expected="$(awk 'NR == 1 { print $1 }' "$checksum_file")"
            actual="$(sha256sum "$file" | awk '{ print $1 }')"
            [[ "$expected" =~ ^[[:xdigit:]]{64}$ ]] || {
              echo "Invalid SHA-256 digest in $checksum_file." >&2; exit 1;
            }
            [[ "$actual" == "$expected" ]] || {
              echo "SHA-256 mismatch for $file." >&2; exit 1;
            }
            echo "SHA-256 verified for $file."
          }
          verify_sha256 "${bundles[0]}" "${bundle_checksums[0]}"
          verify_sha256 "${appimages[0]}" "${appimage_checksums[0]}"

          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release/tag $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Create GitHub Release and upload Linux bundles
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          bundles=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz)
          bundle_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz.sha256)
          appimages=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage)
          appimage_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage.sha256)
          args=(release create "$TAG"
            "${bundles[0]}" "${bundle_checksums[0]}"
            "${appimages[0]}" "${appimage_checksums[0]}"
            --repo "$REPOSITORY" --title "$RELEASE_NAME"
            --notes "Recommended download: the Linux x86_64 AppImage, which bundles SDL3 and LGPL-only FFmpeg runtime libraries. Requires a compatible Vulkan 1.3 loader/GPU driver and host graphics/audio integration libraries. If FUSE 2 is unavailable, try APPIMAGE_EXTRACT_AND_RUN=1. The self-contained directory archive is also provided. Requires a legally obtained copy of the game; no game files are included.")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
