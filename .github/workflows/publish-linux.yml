name: Publish Linux release from successful build

on:
  # Push/PR events only lint this workflow; the read-only validation job is dispatch-only.
  push:
    branches: ["feature/native-linux"]
    paths:
      - ".github/workflows/publish-linux.yml"
      - "tools/validate_linux_release.sh"
  pull_request:
    paths:
      - ".github/workflows/publish-linux.yml"
      - "tools/validate_linux_release.sh"
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Linux native build run ID (from its summary)
        required: true
        type: string
      tag:
        description: New release tag; must match the artifact version (for example v0.7.5-linux)
        required: true
        type: string
      release_name:
        description: Release title
        required: true
        default: "Let's Go Recomp for Linux"
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean
      dry_run:
        description: Validate everything but do not create a tag or release
        required: true
        default: true
        type: boolean

# The workflow's default token can never publish. Only the conditional publish job receives contents:write.
permissions:
  actions: read
  contents: read

jobs:
  validate-workflow:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm this workflow is loaded without publication credentials
        run: echo "Workflow loaded. Push and pull_request events do not validate release assets or publish."

  preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Validate candidate without write permissions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: bash tools/validate_linux_release.sh

      - name: Summarize preflight
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' artifact/build-manifest.json)"
          source_sha="$(jq -r '.source_commit' artifact/build-manifest.json)"
          {
            echo "## Linux release preflight"
            echo
            echo "- Candidate: **$RELEASE_NAME** (`$TAG`)"
            echo "- Version / source: `$version` / `$source_sha`"
            echo "- Prerelease: `$PRERELEASE`"
            echo "- Validation: passed (run provenance, source SHA, artifact inventory, checksums, SBOM, ELF audit, and AppImage probes)"
            echo
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "**DRY RUN:** no tag or release was created. Re-run with `dry_run=false` to publish; the publish job will repeat all validation with write permission."
            else
              echo "Preflight passed. The separate publish job will repeat validation before creating the tag/release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.dry_run == false
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main

      - name: Re-validate candidate with write permission scoped to this job
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
        run: bash tools/validate_linux_release.sh

      - name: Create release pointing at the validated source commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          source_sha="$(jq -er '.source_commit' artifact/build-manifest.json)"
          bundles=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz)
          bundle_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.tar.gz.sha256)
          appimages=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage)
          appimage_checksums=(artifact/LetsGoRecomp-*-linux-x86_64.AppImage.sha256)
          assets=(
            "${bundles[0]}" "${bundle_checksums[0]}"
            "${appimages[0]}" "${appimage_checksums[0]}"
            artifact/BUILD-INFO.txt
            artifact/DEPENDENCIES.json
            artifact/build-size-report.txt
            artifact/build-manifest.json
            artifact/build-manifest-release.json
            artifact/sbom.cdx.json
            artifact/linux-elf-audit.json
          )
          args=(release create "$TAG" "${assets[@]}"
            --repo "$REPOSITORY"
            --target "$source_sha"
            --title "$RELEASE_NAME"
            --notes "Recommended download: the Linux x86_64 AppImage. The bundle includes BUILD-INFO.txt, a payload SHA-256 inventory, a CycloneDX SBOM, a complete ELF dependency audit, and SHA-256 sidecars. Requires a compatible Vulkan 1.3 loader/GPU driver and host desktop graphics/audio integration libraries. If FUSE 2 is unavailable, try APPIMAGE_EXTRACT_AND_RUN=1. The self-contained directory archive is also provided. Requires a legally obtained copy of the game; no game files are included.")
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
          {
            echo "## Linux release published"
            echo
            echo "- Tag: `$TAG`"
            echo "- Source commit: `$source_sha`"
            echo "- Target was set explicitly to the validated build commit."
          } >> "$GITHUB_STEP_SUMMARY"
