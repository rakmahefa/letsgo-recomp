name: Linux native build

on:
  push:
    branches: [main, "feature/native-linux"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libvulkan-dev libvulkan-memory-allocator-dev libshaderc-dev glslc spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev \
            python3 python3-venv python3-pip patchelf zip unzip

      - name: Build SDL3 from source
        run: |
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build /tmp/SDL/build --parallel 2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig

      - name: Set up Python generator
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install capstone unicorn lz4 pyinstaller

      - name: Build native Linux runtime
        run: make -j2 build/lasrecomp

      - name: Build standalone game-code generator
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN \
            --distpath build/helper --workpath build/pyinstaller tools/lasgen.spec
          test -x build/helper/lasgen/lasgen

      - name: Fetch pinned Linux Zig compiler
        run: tools/fetch_zig.sh

      - name: Assemble release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define RT_APP_VERSION "\(.*\)".*/\1/p' runtime/paths.h)"
          test -n "$version"
          root="build/dist/LetsGoRecomp"
          mkdir -p "$root/gamelib-src"
          install -m 755 build/lasrecomp "$root/LetsGoRecomp"
          cp -a build/helper/lasgen "$root/"
          cp -a build/zig "$root/zig"
          cp runtime/cpu.h runtime/simd.h runtime/simd_fp.h runtime/gamelib.h \
            tools/gamelib_entry.c runtime/hle/hle_symbols.txt "$root/gamelib-src/"
          cp docs/icon/icon_1024.png "$root/icon.png"
          cp third_party/fonts/Baloo2/Baloo2-SemiBold.ttf "$root/"
          cp third_party/fonts/Baloo2/OFL.txt "$root/Baloo2-OFL.txt"
          cp LICENSE "$root/LICENSE.txt"
          cp LICENSE-LASRecomp "$root/LICENSE-LASRecomp.txt"
          cat > "$root/README-LINUX.txt" <<'EOF'
          Let's Go Recomp — native Linux build

          Requirements: x86-64 Linux, a CPU supporting AVX2/FMA/BMI2, a current Vulkan 1.3
          driver, and the SDL3, FFmpeg, shaderc and Vulkan runtime libraries.

          Run ./LetsGoRecomp from a writable directory. In the launcher, select your own
          legally obtained and extracted game files (exefs and romfs). The game and its
          copyrighted assets are not included in this package.

          This Linux port is experimental and has not yet been validated in-game. Please
          report issues with lasrecomp.log and include your distro, GPU and driver version.
          EOF
          mkdir -p build/dist
          tar -C build/dist -czf "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz" LetsGoRecomp
          sha256sum "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz" > "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz.sha256"

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: letsgo-recomp-linux-x86_64
          path: |
            build/dist/LetsGoRecomp-*-linux-x86_64.tar.gz
            build/dist/LetsGoRecomp-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write deployment instructions to run summary
        if: success()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Linux build ready"
            echo
            echo "The deployable Linux bundle and SHA-256 checksum are attached as the **letsgo-recomp-linux-x86_64** artifact."
            echo
            echo "To publish it as a GitHub Release, open [Publish Linux release workflow](https://github.com/${GH_REPOSITORY}/actions/workflows/publish-linux.yml) and choose **Run workflow**. Supply this run ID: ` ${RUN_ID} `."
            echo
            echo "Publishing is a separate, deliberate action; pull-request builds never publish releases."
          } >> "$GITHUB_STEP_SUMMARY"
