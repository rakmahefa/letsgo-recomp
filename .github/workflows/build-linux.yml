name: Linux native build

on:
  push:
    branches: [main, "feature/native-linux"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Build on the oldest currently supported Ubuntu runner to keep the GLIBC baseline lower.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make cmake ninja-build pkg-config nasm \
            libvulkan-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxinerama-dev libxss-dev libxkbcommon-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            libibus-1.0-dev libudev-dev \
            python3 python3-venv python3-pip patchelf zip unzip squashfs-tools desktop-file-utils imagemagick

      - name: Install Clang 21 toolchain
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          chmod 755 /tmp/llvm.sh
          sudo /tmp/llvm.sh 21
          sudo apt-get install -y clang-21 lld-21
          clang-21 --version
          test -x /usr/lib/llvm-21/bin/ld.lld
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Install pinned Vulkan-Headers with VK_EXT_device_fault
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.296 https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/Vulkan-Headers
          cmake -S /tmp/Vulkan-Headers -B /tmp/Vulkan-Headers/build \
            -DVULKAN_HEADERS_ENABLE_TESTS=OFF \
            -DVULKAN_HEADERS_ENABLE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/Vulkan-Headers/build
          test -f /usr/local/include/vulkan/vulkan_core.h
          grep -q 'PFN_vkGetDeviceFaultInfoEXT' /usr/local/include/vulkan/vulkan_core.h
          mkdir -p build/licenses
          install -m 644 /tmp/Vulkan-Headers/LICENSE.md build/licenses/Vulkan-Headers-LICENSE.md

      - name: Install pinned Vulkan Memory Allocator header
        run: |
          set -euo pipefail
          sudo install -d /usr/local/include
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.1.0/include/vk_mem_alloc.h \
            -o /tmp/vk_mem_alloc.h
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.1.0/LICENSE.txt \
            -o build-vma-license.txt
          sudo install -m 644 /tmp/vk_mem_alloc.h /usr/local/include/vk_mem_alloc.h
          mkdir -p build/licenses
          install -m 644 build-vma-license.txt build/licenses/VMA-LICENSE.txt

      - name: Build pinned LGPL-only FFmpeg
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://ffmpeg.org/releases/ffmpeg-6.1.6.tar.xz -o /tmp/ffmpeg-6.1.6.tar.xz
          tar -C /tmp -xf /tmp/ffmpeg-6.1.6.tar.xz
          cd /tmp/ffmpeg-6.1.6
          ./configure \
            --prefix=/usr/local \
            --libdir=/usr/local/lib \
            --shlibdir=/usr/local/lib \
            --enable-shared \
            --disable-static \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-network \
            --disable-gpl \
            --disable-nonfree \
            --enable-pic
          make -j2
          sudo make install
          sudo ldconfig
          mkdir -p "$GITHUB_WORKSPACE/build/licenses"
          install -m 644 COPYING.LGPLv2.1 "$GITHUB_WORKSPACE/build/licenses/FFmpeg-LGPL-2.1.txt"

      - name: Build pinned shaderc combined library
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2024.4 https://github.com/google/shaderc.git /tmp/shaderc
          cd /tmp/shaderc
          ./utils/git-sync-deps
          cmake -S /tmp/shaderc -B /tmp/shaderc/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSHADERC_SKIP_TESTS=ON
          cmake --build /tmp/shaderc/build --parallel 2 --target shaderc_combined
          test -s /tmp/shaderc/build/libshaderc/libshaderc_combined.a
          sudo install -d /usr/local/include/shaderc /usr/local/lib
          sudo install -m 644 /tmp/shaderc/libshaderc/include/shaderc/*.h /usr/local/include/shaderc/
          sudo install -m 644 /tmp/shaderc/build/libshaderc/libshaderc_combined.a /usr/local/lib/
          mkdir -p "$GITHUB_WORKSPACE/build/licenses"
          install -m 644 LICENSE "$GITHUB_WORKSPACE/build/licenses/shaderc-LICENSE.txt"
          install -m 644 third_party/glslang/LICENSE.txt "$GITHUB_WORKSPACE/build/licenses/glslang-LICENSE.txt"
          install -m 644 third_party/spirv-tools/LICENSE "$GITHUB_WORKSPACE/build/licenses/SPIRV-Tools-LICENSE.txt"
          install -m 644 third_party/spirv-headers/LICENSE "$GITHUB_WORKSPACE/build/licenses/SPIRV-Headers-LICENSE.txt"

      - name: Build SDL3 from source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.18 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          cmake --build /tmp/SDL/build --parallel 2
          sudo cmake --install /tmp/SDL/build
          sudo ldconfig
          install -m 644 /tmp/SDL/LICENSE.txt "$GITHUB_WORKSPACE/build/licenses/SDL-LICENSE.txt"

      - name: Set up Python generator
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade 'pip==25.2'
          .venv/bin/python -m pip install -r tools/requirements-linux-generator.txt

      - name: Build native Linux runtime
        run: make -j2 CC=clang-21 CXX=clang++-21 DEPS=/usr/local SHADERC=-lshaderc_combined build/lasrecomp

      - name: Build standalone game-code generator
        run: |
          set -euo pipefail
          .venv/bin/python -m PyInstaller --noconfirm --clean --log-level WARN \
            --distpath build/helper --workpath build/pyinstaller tools/lasgen.spec
          test -x build/helper/lasgen/lasgen
          build/helper/lasgen/lasgen --help >/dev/null

      - name: Test setup dry-run with synthetic fixtures
        run: |
          set -euo pipefail
          build/lasrecomp --version
          .venv/bin/python tests/test_setup_dry_run.py --binary build/lasrecomp

      - name: Fetch pinned Linux Zig compiler
        run: |
          set -euo pipefail
          bash tools/fetch_zig.sh
          build/zig/zig version

      - name: Assemble self-contained AppDir
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define RT_APP_VERSION "\(.*\)".*/\1/p' runtime/paths.h)"
          test -n "$version"

          appdir="$GITHUB_WORKSPACE/build/dist/LetsGoRecomp"
          bindir="$appdir/usr/bin"
          mkdir -p "$bindir/gamelib-src" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/512x512/apps" "$appdir/usr/share/licenses/LetsGoRecomp"

          install -m 755 build/lasrecomp "$bindir/LetsGoRecomp"
          cp -a build/helper/lasgen "$bindir/"
          cp -a build/zig "$bindir/zig"
          cp runtime/cpu.h runtime/simd.h runtime/simd_fp.h runtime/gamelib.h \
            tools/gamelib_entry.c runtime/hle/hle_symbols.txt "$bindir/gamelib-src/"
          cp docs/icon/icon_1024.png "$bindir/icon.png"
          cp third_party/fonts/Baloo2/Baloo2-SemiBold.ttf "$bindir/"
          cp third_party/fonts/Baloo2/OFL.txt "$bindir/Baloo2-OFL.txt"
          cp LICENSE "$bindir/LICENSE.txt"
          cp LICENSE-LASRecomp "$bindir/LICENSE-LASRecomp.txt"
          install -m 644 build/licenses/FFmpeg-LGPL-2.1.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/SDL-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/VMA-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/Vulkan-Headers-LICENSE.md "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/shaderc-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/glslang-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/SPIRV-Tools-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"
          install -m 644 build/licenses/SPIRV-Headers-LICENSE.txt "$appdir/usr/share/licenses/LetsGoRecomp/"

          convert docs/icon/icon_1024.png -resize 512x512 "$appdir/lets-go-recomp.png"
          test "$(identify -format '%wx%h' "$appdir/lets-go-recomp.png")" = "512x512"
          cp "$appdir/lets-go-recomp.png" "$appdir/usr/share/icons/hicolor/512x512/apps/lets-go-recomp.png"
          ln -sfn lets-go-recomp.png "$appdir/.DirIcon"

          cat > "$appdir/lets-go-recomp.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Let's Go Recomp
          Comment=Experimental native Linux build of Let's Go Recomp
          Exec=LetsGoRecomp
          Icon=lets-go-recomp
          Categories=Game;
          Terminal=false
          StartupNotify=true
          EOF
          desktop-file-validate "$appdir/lets-go-recomp.desktop"

          cat > "$appdir/README-LINUX.txt" <<'EOF'
          Let's Go Recomp — native Linux x86_64 build

          Recommended: run the .AppImage. It bundles the app's SDL3, LGPL-only FFmpeg and other redistributable shared-library dependencies;
          shaderc is linked statically.

          Requirements still provided by the host: x86-64 Linux with GLIBC 2.35 or newer,
          a CPU supporting AVX2/FMA/BMI2, a Vulkan 1.3 loader and a compatible GPU driver,
          and the normal desktop graphics/audio backend libraries. AppImages may require
          FUSE 2; if unavailable, try APPIMAGE_EXTRACT_AND_RUN=1 ./LetsGoRecomp-*.AppImage.

          The self-contained directory archive is also runnable: extract it and execute
          ./LetsGoRecomp (or ./AppRun). In the launcher, select your own legally obtained
          and extracted game files (exefs and romfs). No game files or copyrighted game
          assets are included.

          This Linux port is experimental and has not yet been validated in-game. Please
          report issues with lasrecomp.log and include your distro, GPU and driver version.

          FFmpeg 6.1.6 is built with --disable-gpl and --disable-nonfree. Its LGPL license
          and the licenses for SDL3 and Vulkan Memory Allocator are in usr/share/licenses.
          EOF

          cat > "$GITHUB_WORKSPACE/build/AppRun.linux" <<'EOF'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$HERE/usr/lib:$HERE/usr/lib64:$HERE/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/LetsGoRecomp" "$@"
          EOF
          chmod 755 "$GITHUB_WORKSPACE/build/AppRun.linux"
          cp "$GITHUB_WORKSPACE/build/AppRun.linux" "$appdir/AppRun"
          chmod 755 "$appdir/AppRun"

          cat > "$appdir/LetsGoRecomp" <<'EOF'
          #!/bin/sh
          set -eu
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/AppRun" "$@"
          EOF
          chmod 755 "$appdir/LetsGoRecomp"

          # Capture tool versions and hashes of payload files before packaging.
          .venv/bin/python tools/write_linux_metadata.py \
            --appdir "$appdir" --version "$version" --commit "$GITHUB_SHA" --ref "$GITHUB_REF" \
            --python .venv/bin/python --zig build/zig/zig --clang clang-21 \
            --ffmpeg 6.1.6 --sdl release-3.4.18 --vulkan-headers v1.3.296 --vma v3.1.0 --shaderc v2024.4

      - name: Build AppImage and verify bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^#define RT_APP_VERSION "\(.*\)".*/\1/p' runtime/paths.h)"
          appdir="$GITHUB_WORKSPACE/build/dist/LetsGoRecomp"
          appimage="$GITHUB_WORKSPACE/build/dist/LetsGoRecomp-${version}-linux-x86_64.AppImage"
          tool="$GITHUB_WORKSPACE/linuxdeploy-x86_64.AppImage"

          curl -fsSL --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o "$tool"
          chmod 755 "$tool"
          desktop-file-validate "$appdir/lets-go-recomp.desktop"

          cd "$GITHUB_WORKSPACE/build/dist"
          # Keep the onedir lasgen helper and Zig binary in their nested directories.
          # Passing either as --executable would flatten its basename into usr/bin and collide with those directories.
          LDAI_OUTPUT="$appimage" \
          LDAI_VERSION="$version" \
          LINUXDEPLOY_OUTPUT_APP_NAME=LetsGoRecomp \
          LINUXDEPLOY_OUTPUT_VERSION="$version" \
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/LetsGoRecomp" \
            --desktop-file "$appdir/lets-go-recomp.desktop" \
            --icon-file "$appdir/lets-go-recomp.png" \
            --custom-apprun "$GITHUB_WORKSPACE/build/AppRun.linux" \
            --exclude-library "libvulkan.so.1" \
            --exclude-library "libGL.so*" \
            --exclude-library "libGLX.so*" \
            --exclude-library "libEGL.so*" \
            --exclude-library "libOpenGL.so*" \
            --exclude-library "libdrm.so*" \
            --exclude-library "libgbm.so*" \
            --exclude-library "libwayland-*.so*" \
            --exclude-library "libwayland-egl.so*" \
            --exclude-library "libX11.so*" \
            --exclude-library "libXext.so*" \
            --exclude-library "libXrender.so*" \
            --exclude-library "libXrandr.so*" \
            --exclude-library "libXcursor.so*" \
            --exclude-library "libXfixes.so*" \
            --exclude-library "libXi.so*" \
            --exclude-library "libXinerama.so*" \
            --exclude-library "libXss.so*" \
            --exclude-library "libxcb*.so*" \
            --exclude-library "libxkbcommon*.so*" \
            --exclude-library "libudev.so*" \
            --exclude-library "libdbus-1.so*" \
            --exclude-library "libsystemd.so*" \
            --exclude-library "libasound.so*" \
            --exclude-library "libpulse*.so*" \
            --exclude-library "libpipewire-*.so*" \
            --exclude-library "libspa-*.so*" \
            --exclude-library "libibus-1.0.so*" \
            --output appimage

          test -s "$appimage"
          chmod 755 "$appimage"

          export LD_LIBRARY_PATH="$appdir/usr/lib:$appdir/usr/lib64:$appdir/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd_output="$(ldd "$appdir/usr/bin/LetsGoRecomp")"
          echo "$ldd_output"
          if grep -q "not found" <<<"$ldd_output"; then
            echo "AppDir has unresolved shared-library dependencies." >&2
            exit 1
          fi

          for soname in libavformat.so.60 libavcodec.so.60 libavutil.so.58 libswscale.so.7; do
            resolved="$(awk -v name="$soname" '$1 == name { print $3; exit }' <<<"$ldd_output")"
            case "$resolved" in
              "$appdir"/usr/lib/*|"$appdir"/usr/lib64/*|"$appdir"/usr/lib/x86_64-linux-gnu/*) ;;
              *) echo "Expected $soname to be bundled, resolved to: ${resolved:-missing}" >&2; exit 1 ;;
            esac
          done

          mkdir -p "$GITHUB_WORKSPACE/build/dist/appimage-smoke"
          cd "$GITHUB_WORKSPACE/build/dist/appimage-smoke"
          "$appimage" --appimage-extract
          extracted="$GITHUB_WORKSPACE/build/dist/appimage-smoke/squashfs-root"
          test -x "$extracted/AppRun"
          test -x "$extracted/usr/bin/LetsGoRecomp"
          find "$extracted/usr" -name 'libavformat.so.60*' -print -quit | grep -q .
          extracted_ldd="$(LD_LIBRARY_PATH="$extracted/usr/lib:$extracted/usr/lib64:$extracted/usr/lib/x86_64-linux-gnu" ldd "$extracted/usr/bin/LetsGoRecomp")"
          if grep -q "not found" <<<"$extracted_ldd"; then
            echo "Extracted AppImage has unresolved shared-library dependencies." >&2
            echo "$extracted_ldd" >&2
            exit 1
          fi
          python3 "$GITHUB_WORKSPACE/tools/audit_linux_elf.py" \
            --root "$extracted" --report "$GITHUB_WORKSPACE/build/dist/linux-elf-audit.json" \
            --require-bundled libavformat.so.60 --require-bundled libavcodec.so.60 \
            --require-bundled libavutil.so.58 --require-bundled libswscale.so.7

          version_output="$(APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version)"
          [[ "$version_output" == "Let's Go Recomp $version" ]] || {
            echo "AppImage --version probe failed: $version_output" >&2; exit 1;
          }

          smoke_home="$GITHUB_WORKSPACE/build/dist/appimage-smoke/home"
          smoke_xdg="$GITHUB_WORKSPACE/build/dist/appimage-smoke/xdg"
          mkdir -p "$smoke_home" "$smoke_xdg"
          env -u LARECOMP_DATA_ROOT -u LARECOMP_GEN -u LARECOMP_CC \
            HOME="$smoke_home" XDG_DATA_HOME="$smoke_xdg" APPIMAGE_EXTRACT_AND_RUN=1 \
            "$appimage" --self-test
          test ! -e "$smoke_xdg/lasrecomp/extracted" || {
            echo "AppImage self-test unexpectedly created game files." >&2; exit 1;
          }

          cp "$appdir/BUILD-INFO.txt" "$GITHUB_WORKSPACE/build/dist/BUILD-INFO.txt"
          cp "$appdir/build-manifest.json" "$GITHUB_WORKSPACE/build/dist/build-manifest.json"
          cp "$appdir/sbom.cdx.json" "$GITHUB_WORKSPACE/build/dist/sbom.cdx.json"

          cd "$GITHUB_WORKSPACE"
          tar -C build/dist -czf "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz" LetsGoRecomp
          sha256sum "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz" > "build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz.sha256"
          sha256sum "$appimage" > "$appimage.sha256"
          .venv/bin/python tools/write_release_manifest.py \
            --appimage "$appimage" \
            --archive "$GITHUB_WORKSPACE/build/dist/LetsGoRecomp-${version}-linux-x86_64.tar.gz" \
            --manifest "$GITHUB_WORKSPACE/build/dist/build-manifest.json" \
            --sbom "$GITHUB_WORKSPACE/build/dist/sbom.cdx.json" \
            --elf-report "$GITHUB_WORKSPACE/build/dist/linux-elf-audit.json" \
            --output "$GITHUB_WORKSPACE/build/dist/build-manifest-release.json" \
            --run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"

      - name: Upload deployable Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: letsgo-recomp-linux-x86_64
          path: |
            build/dist/LetsGoRecomp-*-linux-x86_64.tar.gz
            build/dist/LetsGoRecomp-*-linux-x86_64.tar.gz.sha256
            build/dist/LetsGoRecomp-*-linux-x86_64.AppImage
            build/dist/LetsGoRecomp-*-linux-x86_64.AppImage.sha256
            build/dist/BUILD-INFO.txt
            build/dist/build-manifest.json
            build/dist/build-manifest-release.json
            build/dist/sbom.cdx.json
            build/dist/linux-elf-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Write deployment instructions to run summary
        if: success()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "## Linux AppImage ready"
            echo
            echo "Recommended download: the **LetsGoRecomp-*-linux-x86_64.AppImage** asset. The FFmpeg and SDL3 runtime libraries are bundled, shaderc is linked statically; Vulkan drivers and system graphics/audio integration remain host-provided."
            echo
            echo "The self-contained directory archive, checksums, build provenance, CycloneDX SBOM and ELF dependency audit are also attached as **letsgo-recomp-linux-x86_64**."
            echo
            echo "To publish these assets as a GitHub Release, open [Publish Linux release workflow](https://github.com/${GH_REPOSITORY}/actions/workflows/publish-linux.yml) and choose **Run workflow**. Supply this run ID: ` ${RUN_ID} `."
            echo
            echo "Publishing is a separate, deliberate action; pull-request builds never publish releases."
          } >> "$GITHUB_STEP_SUMMARY"
